<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عقارات برو - كل ما تحتاجه في مكان واحد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>tailwind.config = {theme: {extend: {colors: {brand: {500: '#f97316', 600: '#ea580c'}}, fontFamily: {cairo: ['Cairo', 'sans-serif']}}}}</script>
    <style>
        body {font-family: 'Cairo', sans-serif;background-color: #f8fafc;}
      .hero-bg {background: linear-gradient(90deg, rgba(234, 88, 12, 0.85) 0%, rgba(194, 65, 12, 0.75) 40%, rgba(0, 0, 0, 0.4) 100%), url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;}
      .card-hover {transition: all 0.3s;}.card-hover:hover {transform: translateY(-6px);}
    </style>
</head>
<body class="text-slate-800">

    <header class="bg-white sticky top-0 z-40 border-b shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="resetFilters()">
                <div class="bg-brand-500 text-white p-2.5 rounded-xl"><i class="fa-solid fa-house-chimney text-2xl"></i></div>
                <span class="font-black text-2xl text-brand-600">عقارات برو</span>
            </div>

            <!-- Auth Section -->
            <div id="authSection" class="flex items-center gap-3">
                <!-- هيتملي بالجافاسكربت -->
            </div>
        </div>
    </header>

    <section class="hero-bg relative pt-16 pb-28 text-white">
        <div class="max-w-7xl mx-auto px-4">
            <h1 class="text-4xl font-black mb-4">ابحث عن <span class="text-amber-300">منزلك المثالي</span></h1>
            <div class="bg-white rounded-2xl p-5 shadow-2xl text-slate-800 max-w-5xl mt-6">
                <form onsubmit="event.preventDefault(); applySearch();" class="grid grid-cols-1 md:grid-cols-12 gap-3">
                    <div class="md:col-span-4"><select id="searchRegion" class="bg-slate-50 rounded-xl px-3 py-3 w-full border"><option value="">اختر المنطقة</option></select></div>
                    <div class="md:col-span-3"><select id="searchType" class="bg-slate-50 rounded-xl px-3 py-3 w-full border"><option value="">نوع العقار</option></select></div>
                    <div class="md:col-span-3"><select id="searchPrice" class="bg-slate-50 rounded-xl px-3 py-3 w-full border"><option value="">نطاق السعر</option><option value="under_5m">أقل من 5,000,000</option><option value="above_10m">أكثر من 10,000,000</option></select></div>
                    <div class="md:col-span-2"><button class="w-full bg-brand-500 text-white font-bold py-3.5 rounded-xl"><i class="fa-solid fa-magnifying-glass"></i> بحث</button></div>
                </form>
            </div>
        </div>
    </section>

    <section id="properties" class="max-w-7xl mx-auto px-4 py-16">
        <h2 class="text-3xl font-extrabold mb-8">أحدث العقارات</h2>
        <div id="propertyGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </section>

    <!-- Property Modal -->
    <div id="propertyModal" class="fixed inset-0 bg-slate-900/60 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto relative">
            <button onclick="closeModal('propertyModal')" class="absolute top-4 left-4 w-9 h-9 bg-white/80 rounded-full"><i class="fa-solid fa-xmark"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAexsdwzcSPvUeQ9nZYPna6AHlynPiiIXE",
          authDomain: "webr-5bb4b.firebaseapp.com",
          projectId: "webr-5bb4b",
          storageBucket: "webr-5bb4b.firebasestorage.app",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        let propertiesData = [];
        let currentUser = null;

        // 1. مراقبة حالة تسجيل الدخول
        auth.onAuthStateChanged(user => {
            currentUser = user;
            updateAuthUI();
        });

        // 2. تحديث شكل الهيدر حسب حالة الدخول
        function updateAuthUI(){
            const authSection = document.getElementById('authSection');
            if(currentUser){
                authSection.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${currentUser.photoURL}" class="w-10 h-10 rounded-full border-2 border-brand-500">
                        <span class="font-bold hidden sm:block">${currentUser.displayName}</span>
                        <button onclick="logout()" class="px-4 py-2 rounded-xl bg-red-500 text-white font-bold text-sm">خروج</button>
                    </div>
                `;
            } else {
                authSection.innerHTML = `
                    <button onclick="loginWithGoogle()" class="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-white border-2 border-slate-200 hover:bg-slate-50 font-bold text-sm">
                        <img src="https://www.google.com/favicon.ico" class="w-4 h-4">
                        <span>تسجيل بجوجل</span>
                    </button>
                `;
            }
        }

        // 3. دوال تسجيل الدخول والخروج
        function loginWithGoogle(){
            auth.signInWithPopup(provider).then(result => {
                showToast(`مرحباً ${result.user.displayName}`);
            }).catch(error => { alert(error.message); });
        }
        function logout(){
            auth.signOut();
        }

        // باقي اكواد الموقع زي ما هي
        db.collection("properties").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            propertiesData = [];
            snapshot.forEach((doc) => { propertiesData.push({ id: doc.id,...doc.data() }); });
            renderProperties(propertiesData);
            updateDropdowns();
        });

        function renderProperties(list) {
            const grid = document.getElementById('propertyGrid');
            grid.innerHTML = '';
            list.forEach(prop => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl overflow-hidden shadow-sm card-hover cursor-pointer";
                card.onclick = () => openPropertyModal(prop.id);
                card.innerHTML = `
                    <div class="relative h-48"><img src="${prop.image}" class="w-full h-full object-cover">
                    <span class="absolute top-3 right-3 ${prop.tag==='للإيجار'?'bg-amber-500':'bg-brand-500'} text-white font-bold text-xs px-3 py-1 rounded-md">${prop.tag}</span></div>
                    <div class="p-5"><h3 class="font-bold text-lg mb-1">${prop.title}</h3><p class="text-slate-500 text-sm"><i class="fa-solid fa-location-dot text-brand-500"></i> ${prop.location}</p><div class="text-brand-600 font-black text-xl mt-2">${prop.price.toLocaleString()} ج.م</div></div>
                `;
                grid.appendChild(card);
            });
        }

        function applySearch() {
            const region = document.getElementById('searchRegion').value;
            const type = document.getElementById('searchType').value;
            let filtered = propertiesData.filter(item => (!region || item.regionKey === region) && (!type || item.type === type));
            renderProperties(filtered);
        }
        function updateDropdowns(){
            const regions = [...new Set(propertiesData.map(p=>p.regionKey))];
            const types = [...new Set(propertiesData.map(p=>p.type))];
            document.getElementById('searchRegion').innerHTML = '<option value="">اختر المنطقة</option>' + regions.map(r=>`<option value="${r}">${r}</option>`).join('');
            document.getElementById('searchType').innerHTML = '<option value="">نوع العقار</option>' + types.map(t=>`<option value="${t}">${t}</option>`).join('');
        }
        function openPropertyModal(id) {
            const prop = propertiesData.find(p => p.id === id);
            document.getElementById('modalContent').innerHTML = `<img src="${prop.image}" class="w-full h-80 object-cover"><div class="p-6"><h2 class="text-2xl font-black">${prop.title}</h2><p>${prop.location}</p><div class="text-2xl font-black text-brand-600 my-4">${prop.price.toLocaleString()} ج.م</div><p>${prop.desc}</p></div>`;
            openModal('propertyModal');
        }
        function openModal(id){document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex');}
        function closeModal(id){document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex');}
        function showToast(msg){alert(msg);}
    </script>
</body>
</html>
